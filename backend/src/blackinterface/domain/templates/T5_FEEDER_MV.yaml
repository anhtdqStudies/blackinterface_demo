id: T5_FEEDER_MV
version: 3
title: "MV feeder bay — single busbar, no busbar selector"
bay_type: FEEDER_MV
observed_on: [J01,   # DEMO_SAS v654 (2026-08-04) and T220PHOCAO v1052 (2026-08-10)
              ]

# v3 adds `aliases` — see the note in T1_LINE.yaml. -35 / -38 again.

# 22 kV switchgear: no XSWI1/XSWI2, the incomer is the transformer LV winding.
#
#   J01L = AT1L and 431C and 431-3C          (CheckLiveState Lua)
#
# The Lua is a plain AND and does not fix the order. The Grid Designer drawing
# does: AT1 -> -3 -> 431 -> feeder. v1 had the breaker first, which put the
# disconnector on the wrong side of it.

nodes:
  - {id: n_a,    kind: internal, label: "disconnector/breaker"}
  - {id: n_feed, kind: external, label: "Feeder"}

slots:
  - {ln: XSWI3,  role: transformer_disconnector, endpoints: [BB, n_a],     order: 0}
  - {ln: XSWI31, role: earth_switch,             endpoints: [n_a, EARTH],  order: 1, side: left,
     required: false, aliases: [XSWI35]}
  - {ln: XSWI32, role: earth_switch,             endpoints: [n_a, EARTH],  order: 1, side: right,
     required: false, aliases: [XSWI38]}
  - {ln: XCBR1,  role: breaker,                  endpoints: [n_a, n_feed], order: 2}

# ASSUMPTION - DEMO_SAS has no 22 kV busbar object, so `BB` resolves to an
# inferred placeholder and the bay reports `busbar_not_in_source`. Electrically
# the incomer here is AT1's LV winding, not a busbar; modelling that properly
# needs the transformer as a graph element (not yet in the model). See Q6.
