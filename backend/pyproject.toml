[project]
name = "blackinterface"
version = "0.0.1"
description = "AI-first operations layer for OneATS substation SCADA"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "asyncua>=1.1.5",
    "sse-starlette>=2.1",
    "pyyaml>=6.0",
    "structlog>=24.4",
]

[project.optional-dependencies]
agent = [
    "pydantic-ai-slim[openai]>=0.0.20",
]

[dependency-groups]
dev = [
    "httpx>=0.27",       # fastapi.testclient
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
]

# The repo lives in a OneDrive folder, where uv's default hardlink strategy
# fails with "incompatible hardlinks (os error 396)". Copying is slower but works.
[tool.uv]
link-mode = "copy"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blackinterface"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "SIM",       # simplify
    "TID",       # tidy imports (banned-api enforces layer boundaries)
    "RUF",
]
ignore = ["E501"]  # line length handled by formatter

# Enforce architecture layer boundaries (AGENTS.md invariant I6).
# `domain` must not import any other layer; only `integration` may touch OPC UA.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"asyncua".msg = "Only integration/opcua may import asyncua (AGENTS.md I6)."

[tool.ruff.lint.per-file-ignores]
"src/blackinterface/integration/**" = ["TID251"]  # integration is allowed asyncua
"tools/**" = ["TID251"]
"tests/**" = ["TID251"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
packages = ["blackinterface"]
mypy_path = "src"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = ["asyncua.*"]
ignore_missing_imports = true
implicit_reexport = true   # asyncua re-exports Client / ua without __all__

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers -m 'not live'"
markers = [
    "live: requires a running OneATS DataServer at localhost:48050",
]
